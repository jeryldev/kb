name: Test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these first and releases only if they pass.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Tests that need the plugin harness or sqlite3 fail here rather than skip.
      KB_CI: "1"
    steps:
      - uses: actions/checkout@v4

      # The newest patch of go.mod's Go version: patches carry security
      # fixes govulncheck checks for. Change the minor with go.mod's.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Obsidian Kanban plugin, at the commit kb's board format was
      # checked against, for the harness that runs its parser and writer.
      - uses: actions/checkout@v4
        with:
          repository: mgmeyers/obsidian-kanban
          ref: 5134c05ad9a7861f551cd15d57cf50db8394901a
          path: obsidian-kanban

      - name: Build the plugin harness
        run: |
          cd obsidian-kanban && yarn install --frozen-lockfile --ignore-scripts && cd ..
          tools/kanban-compat/build.sh "$PWD/obsidian-kanban"

      - name: sqlite3, for the kb 0.3 import tests
        if: runner.os == 'Linux'
        run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Known vulnerabilities
        # v1.1.4 runs on Go 1.25; later versions need Go 1.26.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
